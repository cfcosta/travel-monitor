[workspace]
# Crates split by responsibility (docs/decisions: DECISIONS.md 0045, 0048).
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = { version = "0.3.34", default-features = false, features = [
  "sink",
  "std",
] }
gpui = { package = "gpui-pre", version = "=0.3.7" }
hegeltest = { version = "0.48.1", features = ["serde_json", "static-engine"] }
notify-rust = "4"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "handshake",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "1.0.9"

tm-app = { path = "crates/tm-app" }
tm-browser = { path = "crates/tm-browser" }
tm-daemon = { path = "crates/tm-daemon" }
tm-domain = { path = "crates/tm-domain" }
tm-gflights = { path = "crates/tm-gflights" }
tm-jev = { path = "crates/tm-jev" }
tm-scheduler = { path = "crates/tm-scheduler" }
tm-store = { path = "crates/tm-store" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
