[package]
name = "tm-compositor"
description = "A minimal offscreen Wayland compositor on the GPU render node, for a headed Chromium with no visible window."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Upstream smithay, only the parts an offscreen compositor needs: GBM
# buffers and EGL/GLES on a render node, the Wayland server side and the
# desktop helpers. No DRM master, session, libinput or Xwayland.
smithay = { version = "0.7.0", default-features = false, features = [
  "backend_egl",
  "backend_gbm",
  "desktop",
  "renderer_gl",
  "wayland_frontend",
] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true

# The workspace forbids unsafe code. Creating the EGL display and the
# GLES renderer is unsafe in smithay, so this crate denies it instead
# and allows it at those two calls (src/gpu.rs).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
