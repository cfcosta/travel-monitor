version.workspace = true
edition.workspace = true
publish.workspace = true
# Parts of src/snapshot.rs, src/agent and assets/ derive from Browser Use's
# MIT-licensed Jev Ultrafast, through vs1-browser: see LICENSE-UPSTREAM and
# UPSTREAM.json.

[dependencies]
base64.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tm-domain.workspace = true
tm-jev.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "time",
] }

[lints]
workspace = true
